# Inclua este bloco dentro do mesmo `server {}` que publica o Conselho.
location /colaboracao {
    proxy_pass http://127.0.0.1:1234;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# A API interna exige segredo mesmo em loopback. Se o Node acessa o domínio
# público, mantenha estes endpoints disponíveis; eles não aceitam chamadas
# sem X-Collaboration-Secret.
location ^~ /internal/collaboration/ {
    try_files $uri /index.php?$query_string;
}
